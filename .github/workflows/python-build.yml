# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.12']
        architecture: ['x64']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} ${{ matrix.architecture }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine pyinstaller~=5.6 build

    - name: Setup
      run: |
        export BDISTWHEELFREEZELIBS=true
        python -m build
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        built_path=Amulet-py_${{ matrix.python-version }}-$RUNNER_OS-${{ matrix.architecture }}.zip
        echo "BUILT_PATH=$built_path" >> $GITHUB_ENV
        python -m PyInstaller -f -y Amulet.spec
        cd dist
        if [ "$RUNNER_OS" == "Windows" ]; then
          7z a $built_path Amulet
        elif [ "$RUNNER_OS" == "macOS" ]; then
          zip -r $built_path Amulet
        else
          echo "$RUNNER_OS not supported"
          exit 1
        fi
        cd ..

    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BUILT_PATH }}
        path: ./dist/${{env.BUILT_PATH}}
